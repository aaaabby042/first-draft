
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>2027 Jay Park World Tour</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="poster">

    <!-- Top right slogan -->
    <div class="slogan">
      JAY 4 UR HEART
    </div>

    <!-- Main title -->
    <header class="title">
      <h1>
        <span>2027</span>
        <span>JAY PARK</span>
        <span>WORLD TOUR</span>
      </h1>
    </header>

    <!-- Tour dates -->
    <section class="tour-dates">

      <div class="date">
        <span>NEW YORK</span>
        <span>2.22</span>
      </div>

      <div class="date">
        <span>LONDON</span>
        <span>3.01</span>
      </div>

      <div class="date">
        <span>PARIS</span>
        <span>3.18</span>
      </div>

      <div class="date">
        <span>TOKYO</span>
        <span>3.27</span>
      </div>

      <div class="date">
        <span>SEOUL</span>
        <span>4.05</span>
      </div>

    </section>

    <!-- Artist image -->
    <div class="artist">
      <img src="jay.PNG" alt="Jay Park">
    </div>

  </main>

</body>
</html>
